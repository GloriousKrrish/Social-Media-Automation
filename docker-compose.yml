version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: socialpilot_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: socialpilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: socialpilot_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: socialpilot_backend
    restart: always
    environment:
      - ENVIRONMENT=production
      - SQLALCHEMY_DATABASE_URI=postgresql+asyncpg://postgres:postgrespassword@db:5432/socialpilot_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=ENTERPRISE_PRODUCTION_SECRET_KEY_CHANGE_ME_32_BYTES
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
